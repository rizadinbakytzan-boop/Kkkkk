<!DOCTYPE html>
<html>
<head>
<style>
  .card {
      width: 300px;
      height: 400px;
      overflow: scroll;
      border: 5px solid pink;
      position: relative;
      }

      .title {
      margin-bottom: 20px;
      text-align: center;
      }

      .box {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1;
      background: yellow;
      }
      </style>
      </head>
      <body>

     <div class="card">
     <div class="box">B-Day!</div>
                                                                      
     <div class="title">
     <h1>Приглашение на ДР</h1>
     </div>
     <p>Приходи на мой день рождения!</p>
     <p>День: <span>Четверг</span></p>
     <p>Время: <span>21:00</span></p>
     <p>Место: <span>малая столовая</span></p>
     </div>
</body>
</html>
